<style>
/* Layout: tek sütun, üstte üç sekme, altında form kartı ve sonuç kartı; demirci tezgâhı gibi çelik zemin, bakır vurgu. */
:root {
  --bg: #e8ebef;
  --surface: #f6f7f9;
  --field: #ffffff;
  --fg: #1a2028;
  --muted: #566170;
  --line: #ccd3db;
  --accent: #b0501c;
  --accent-fg: #ffffff;
  --ok: #1d7d46;
  --bad: #b83232;
  --r-common: #aeb6c1;
  --r-rare: #3b82f6;
  --r-epic: #22a45d;
  --r-legend: #e0a800;
  --r-ultimate: #e5484d;
  --r-mythic: #9a5cf0;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --surface: #1a2029; --field: #11161d; --fg: #e8ecf1; --muted: #98a3b0;
    --line: #2c3542; --accent: #f08a4b; --accent-fg: #1b1208; --ok: #4ccf86; --bad: #ff8080;
    --r-common: #7c8694; --r-rare: #5a9bff; --r-epic: #3ecf7a; --r-legend: #f2c230; --r-ultimate: #ff6b70; --r-mythic: #b583ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --surface: #1a2029; --field: #11161d; --fg: #e8ecf1; --muted: #98a3b0;
  --line: #2c3542; --accent: #f08a4b; --accent-fg: #1b1208; --ok: #4ccf86; --bad: #ff8080;
  --r-common: #7c8694; --r-rare: #5a9bff; --r-epic: #3ecf7a; --r-legend: #f2c230; --r-ultimate: #ff6b70; --r-mythic: #b583ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.5 var(--font-body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font: 600 13px/1 var(--font-display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.brand { color: var(--fg); font-weight: 700; margin-right: 4px; }
h1 { font: 700 34px/1.05 var(--font-display); margin: 0; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.tab {
  font: 600 18px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  padding: 14px 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; min-width: 0;
}
.tab + .tab { border-left: 1px solid var(--line); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.tab:focus-visible, button.go:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
form.card { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }
label, .lbl { font: 600 14px/1.25 var(--font-body); }
.hint { font-size: 12.5px; line-height: 1.35; color: var(--muted); }
input[type="text"], select {
  width: 100%; height: 46px; padding: 0 12px; font: 500 17px/1 var(--font-body);
  color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
input:disabled, select:disabled { opacity: .55; }
.suffix { position: relative; }
.suffix input { padding-right: 32px; }
.suffix span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
.switch input { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; margin: 0; flex: none; cursor: pointer; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--field); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); background: var(--accent-fg); }
@media (prefers-reduced-motion: reduce) { .switch input, .switch input::after { transition: none; } }

.err { grid-column: 1 / -1; margin: 0; padding: 10px 12px; border: 1px solid var(--bad); border-radius: 6px; color: var(--bad); font-weight: 500; font-size: 14px; }
button.go {
  grid-column: 1 / -1; height: 52px; border: 0; border-radius: 6px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); font: 700 22px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button.go:active { transform: translateY(1px); }

#result { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 12px; }
.chip { align-self: flex-start; font: 600 12px/1 var(--font-body); letter-spacing: .04em; padding: 6px 8px; border: 1px dashed var(--muted); border-radius: 4px; color: var(--muted); }
.status { display: flex; flex-direction: column; gap: 2px; }
.status .k { font-size: 14px; color: var(--muted); font-weight: 500; }
.status .big { font: 700 44px/1.05 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.status .big small { font: 600 20px/1 var(--font-display); letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin-left: 6px; }
.status.ok .big { color: var(--ok); }
.status.bad .big { color: var(--bad); }
dl.rows { margin: 0; display: grid; grid-template-columns: 1fr; }
dl.rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
dl.rows dt { color: var(--muted); font-size: 14.5px; min-width: 0; }
dl.rows dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
h2 { font: 700 15px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

.asc { display: flex; flex-direction: column; gap: 8px; }
.stars { display: flex; align-items: center; gap: 6px; }
.stars svg { width: 30px; height: 30px; flex: none; }
.stars .arrow { color: var(--muted); font-size: 18px; margin: 0 6px; }
.star-on { fill: var(--accent); stroke: var(--accent); }
.star-off { fill: none; stroke: var(--line); }
.star-next { fill: none; stroke: var(--accent); stroke-dasharray: 3 2.5; }
.asc p { margin: 0; font-size: 15px; }

.odds { display: flex; flex-direction: column; gap: 14px; }
.odd .t { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px; gap: 8px; }
.bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; min-width: 2px; }
.legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 4px 10px; font-size: 13.5px; }
.legend li { display: flex; align-items: center; gap: 6px; min-width: 0; font-variant-numeric: tabular-nums; }
.legend li.zero { color: var(--muted); }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.legend .pc { margin-left: auto; font-weight: 600; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
@media (max-width: 380px) { form.card { grid-template-columns: 1fr; } .status .big { font-size: 38px; } }
</style>

function parseNum(s) {
  s = String(s).trim().replace(/\s/g, '');
  if (!s) return NaN;
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');

  return /^\d*\.?\d+$|^\d+\.$/.test(s) ? parseFloat(s) : NaN;
}

    <div class="f">
      <label for="${id('extra')}">Ekstra çağırma şansı</label>
      <select id="${id('extra')}">${Array.from({ length: 11 }, (_, i) => i * 5).map(p => `<option value="${p}"${String(p) === d.extra ? ' selected' : ''}>%${p}</option>`).join('')}</select>
      <span class="hint">${c.extraHint}</span>
    </div>
    <div class="f wide">
      <label class="switch" for="${id('usechance')}"><input type="checkbox" role="switch" id="${id('usechance')}" checked><span>Şans faktörünü hesaba kat</span></label>
      <span class="hint">Kapatırsan her çağırma tam bir çağırma sayılır, şansa güvenmeyen garantili hesap çıkar.</span>
    </div>` : '';
  return `
  <form class="card" id="form-${key}" data-key="${key}" novalidate hidden>
    <div class="f">
      <label for="${id('level')}">Mevcut seviye</label>
      <input type="text" inputmode="numeric" maxlength="3" id="${id('level')}" value="${d.level}" autocomplete="off">
      <span class="hint">1 ile 100 arası</span>
    </div>
    <div class="f">
      <label for="${id('progress')}">O seviyedeki puanın</label>
      <input type="text" inputmode="numeric" maxlength="5" id="${id('progress')}" value="${d.progress}" autocomplete="off">
      <span class="hint" id="${id('need')}"></span>
    </div>
    <div class="f">
      <label for="${id('star')}">Şu anki yıldız</label>
      <select id="${id('star')}">
        <option value="0">Yıldız yok</option><option value="1">1 yıldız</option><option value="2">2 yıldız</option><option value="3">3 yıldız</option>
      </select>
    </div>
    <div class="f">
      <label for="${id('owned')}">Elindeki ${c.unit}</label>
      <input type="text" inputmode="numeric" maxlength="9" id="${id('owned')}" value="${d.owned}" autocomplete="off">
    </div>
    <div class="f ${c.extra ? '' : 'wide'}">
      <label for="${id('cost')}">${c.costLabel}</label>
      <select id="${id('cost')}"${c.costOpts.length === 1 ? ' disabled' : ''}>${c.costOpts.map(o => {
        const dis = Math.round((1 - o / c.base) * 100);
        return `<option value="${o}"${String(o) === d.cost ? ' selected' : ''}>${o.toLocaleString('tr-TR')}${dis ? ' (%' + dis + ' indirim)' : (c.costOpts.length > 1 ? ' (indirimsiz)' : '')}</option>`;
      }).join('')}</select>
      <span class="hint">${c.costHint}</span>
    </div>
    ${extra}
    <p class="err" role="alert" id="${id('err')}" hidden></p>
    <button type="button" class="go" id="${id('go')}">Hesapla</button>
  </form>`;
}

function starSvg(cls) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><polygon class="${cls}" stroke-width="1.8" stroke-linejoin="round" points="12,2.5 14.9,8.8 21.8,9.5 16.6,14.1 18.1,20.9 12,17.4 5.9,20.9 7.4,14.1 2.2,9.5 9.1,8.8"/></svg>`;
}

function read(key) {
  const c = CFG[key], g = n => document.getElementById(key + '-' + n);
  const L = parseNum(g('level').value), pr = parseNum(g('progress').value);
  const owned = parseNum(g('owned').value), cost = parseFloat(g('cost').value);
  const star = parseInt(g('star').value, 10);
  const extra = c.extra ? parseInt(g('extra').value, 10) : 0;
  const use = c.extra ? g('usechance').checked : false;
  if (!Number.isInteger(L) || L < 1 || L > 100) return { error: 'Seviye 1 ile 100 arasında bir tam sayı olmalı.' };
  const req = L < 100 ? D[key].req[L - 1] : 0;
  if (L < 100 && (!Number.isInteger(pr) || pr < 0 || pr >= req))
    return { error: `${L}. seviyede puanın 0 ile ${req - 1} arasında olmalı. Bu seviye ${req} çağırma istiyor.` };
  if (!(owned >= 0)) return { error: 'Elindeki kaynak miktarını sayı olarak yaz.' };
  if (!(cost > 0)) return { error: 'Çağırma maliyetini sıfırdan büyük bir sayı olarak yaz.' };
  if (c.extra && !(extra >= 0 && extra <= 50 && extra % 5 === 0)) return { error: 'Ekstra çağırma şansı 0 ile 50 arasında, 5\'in katı olmalı.' };
  return { L, pr: L < 100 ? pr : 0, owned, cost, star, extra, use };
}

function calc(key, v) {
  const c = CFG[key], cum = CUM[key], total = cum[99];
  const done = v.L >= 100 ? total : cum[v.L - 1] + v.pr;
  const need = Math.max(0, total - done);
  const mult = c.extra && v.use ? 1 + v.extra / 100 : 1;
  let calls, pulls = 0, costTotal, canSummons, fullRound, baseCost;
  if (key === 'skill') {
    pulls = Math.ceil(need / 5);
    calls = pulls * 5;
    costTotal = pulls * v.cost;
    canSummons = Math.floor(v.owned / v.cost + 1e-9) * 5;
    fullRound = Math.ceil(total / 5) * v.cost;
    baseCost = costTotal;
  } else {
    calls = Math.ceil(need / mult - 1e-9);
    costTotal = Math.ceil(calls * v.cost - 1e-9);
    canSummons = Math.floor(Math.floor(v.owned / v.cost + 1e-9) * mult + 1e-9);
    fullRound = Math.ceil(total / mult - 1e-9) * v.cost;
    baseCost = Math.ceil(need * v.cost - 1e-9);
  }
  const pts = done + canSummons;
  let lvl = 1;
  while (lvl < 100 && cum[lvl] <= pts) lvl++;
  // Yükseliş sonrası: artan kaynakla yeni yıldızda 1. seviyeden başlanır
  const leftover = need === 0 ? v.owned : Math.max(0, v.owned - costTotal);
  const aSum = key === 'skill'
    ? Math.floor(leftover / v.cost + 1e-9) * 5
    : Math.floor(Math.floor(leftover / v.cost + 1e-9) * mult + 1e-9);
  let afterLvl = 1;
  while (afterLvl < 100 && cum[afterLvl] <= aSum) afterLvl++;
  const afterPr = afterLvl >= 100 ? 0 : aSum - cum[afterLvl - 1];
  return { total, need, mult, calls, pulls, costTotal, missing: Math.max(0, costTotal - v.owned), surplus: Math.max(0, v.owned - costTotal), lvl, fullRound: Math.ceil(fullRound), baseCost, leftover, afterLvl, afterPr };
}

function oddsBlock(title, p) {
  const bar = p.map((x, i) => x > 0 ? `<i style="width:${x}%;background:${RAR[i][1]}"></i>` : '').join('');
  const li = p.map((x, i) => `<li class="${x > 0 ? '' : 'zero'}"><span class="sw" style="background:${RAR[i][1]}"></span>${RAR[i][0]}<span class="pc">${pct(x)}</span></li>`).join('');
  return `<div class="odd"><div class="t"><span>${title}</span></div><div class="bar" role="img" aria-label="${title} nadirlik şansları">${bar}</div><ul class="legend">${li}</ul></div>`;
}

let example = { pet: true, mount: true, skill: true };

function render(key, v) {
  const c = CFG[key], r = calc(key, v), out = document.getElementById('result');
  const chance = c.extra && v.use && v.extra > 0;
  let status;
  if (r.need === 0) status = `<div class="status ok"><span class="k">Durum</span><span class="big">Yükseliş hazır</span></div>`;
  else if (r.missing > 0) status = `<div class="status bad"><span class="k">Yükseliş için daha lazım</span><span class="big">${fmt(r.missing)}<small>${c.unit}</small></span></div>`;
  else status = `<div class="status ok"><span class="k">Kaynağın yeterli, artan</span><span class="big">${fmt(r.surplus)}<small>${c.unit}</small></span></div>`;

  const callRow = key === 'skill'
    ? `<div><dt>Gereken çekim</dt><dd>${fmt(r.pulls)} adet 5'li (${fmt(r.calls)} çağırma)</dd></div>`
    : `<div><dt>${chance ? 'Yapılacak çağırma (tahmini)' : 'Yapılacak çağırma'}</dt><dd>${fmt(r.calls)}</dd></div>`;
  const rows = r.need === 0 ? '' : `
    <div><dt>Seviye 100'e kalan puan</dt><dd>${fmt(r.need)}</dd></div>
    ${callRow}
    <div><dt>Gereken toplam ${c.unit}</dt><dd>${fmt(r.costTotal)}</dd></div>
    <div><dt>Elindeki ${c.unit}</dt><dd>${fmt(v.owned)}</dd></div>
    <div><dt>Mevcut kaynakla ulaşacağın seviye</dt><dd>${r.lvl >= 100 ? '100 (yükseliş hazır)' : r.lvl + (chance ? ' (tahmini)' : '')}</dd></div>
    ${chance ? `<div><dt>Şans olmadan (garantili) gereken</dt><dd>${fmt(r.baseCost)}</dd></div>` : ''}`;
  const roundRow = `<div><dt>Sıfırdan 100'e tam tur</dt><dd>${fmt(r.fullRound)} ${c.unit}</dd></div>`;

  const s = v.star;
  let asc;
  if (s >= 3) {
    asc = `<div class="stars">${starSvg('star-on').repeat(3)}</div><p>3 yıldız dolu. Bu sistemde başka yükseliş yok.</p>`;
  } else {
    const cur = starSvg('star-on').repeat(s) + starSvg('star-off').repeat(3 - s - 1);
    const nxt = starSvg('star-next');
    const stars = starSvg('star-on').repeat(s) + nxt + starSvg('star-off').repeat(2 - s);
    const txt = r.need === 0
      ? `Şimdi yükseliş yapabilirsin. Seviye 1'e dönersin ve ${s === 0 ? 'ilk' : (s + 1) + '.'} yıldızını alırsın (${s} yıldızdan ${s + 1} yıldıza).`
      : `Seviye 100'e ulaşınca yükseliş yapabilirsin. Yükseliş sonrası seviye 1'e dönersin ve ${s} yıldızdan ${s + 1} yıldıza çıkarsın.`;
    const afterTxt = r.need > 0 && r.missing > 0
      ? `Yükseliş sonrası seviyen: <b>1</b>. Yükseliş için kaynağın henüz yetmiyor, bu yüzden artan kaynak sayılmadı.`
      : `Yükseliş sonrası seviyen: <b>${r.afterLvl}</b>${r.afterLvl < 100 && r.afterPr > 0 ? ` (o seviyede ${fmt(r.afterPr)} puan)` : ''}. Artan ${fmt(r.leftover)} ${c.unit} yeni yıldızda 1. seviyeden harcanırsa${chance ? ' tahminen' : ''} bu seviyeye gelirsin.`;
    asc = `<div class="stars" role="img" aria-label="${s} yıldızdan ${s + 1} yıldıza">${stars}</div><p>${txt}</p><p>${afterTxt}</p>`;
  }

  const odds = oddsBlock(`Şu anki seviyede (${v.L}) şanslar`, D[key].prob[v.L - 1]) +
    oddsBlock(`Yükseliş sonrası seviyede (${r.afterLvl}) şanslar`, D[key].prob[r.afterLvl - 1]);

  out.innerHTML = `
    ${example[key] ? '<span class="chip">Örnek değerlerle hesaplandı. Kendi değerlerini yazıp Hesapla\'ya bas.</span>' : ''}
    ${status}
    <dl class="rows">${rows}${roundRow}</dl>
    <div class="asc"><h2>Yükseliş sonrası</h2>${asc}</div>
    <div class="odds"><h2>Nadirlik şansları</h2>${odds}</div>
    <p class="note">${chance ? 'Ekstra şans açıkken sonuç tahmindir, gerçek harcama rastgeleliğe göre değişebilir. Şans faktörünü kapatırsan garantili hesabı görürsün. ' : ''}Kaynak hesabında her zaman yukarı yuvarlanır.</p>`;
}

function updateNeed(key) {
  const L = parseNum(document.getElementById(key + '-level').value);
  const el = document.getElementById(key + '-need');
  el.textContent = Number.isInteger(L) && L >= 1 && L < 100 ? `Bu seviye ${D[key].req[L - 1]} çağırma istiyor` : (L === 100 ? 'Maksimum seviye' : '');
}

function run(key, user) {
  const err = document.getElementById(key + '-err');
  const v = read(key);
  if (v.error) { err.textContent = v.error; err.hidden = false; return; }
  err.hidden = true;
  if (user) example[key] = false;
  try { render(key, v); } catch (e) { err.textContent = 'Hesaplama hatası: ' + e.message; err.hidden = false; return; }
  if (user) {
    const b = document.getElementById(key + '-go');
    b.textContent = 'Hesaplandı';
    setTimeout(() => { b.textContent = 'Hesapla'; }, 1200);
  }
  if (user && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  else if (user) document.getElementById('result').scrollIntoView({ block: 'start' });
}

function show(key) {
  for (const k in CFG) {
    document.getElementById('form-' + k).hidden = k !== key;
    document.getElementById('tab-' + k).setAttribute('aria-selected', k === key ? 'true' : 'false');
  }
  run(key, false);
}

document.getElementById('forms').innerHTML = Object.keys(CFG).map(formHtml).join('');
for (const k in CFG) {
  const f = document.getElementById('form-' + k);
  f.addEventListener('submit', e => { e.preventDefault(); run(k, true); });
  document.getElementById(k + '-go').addEventListener('click', () => run(k, true));
  const lvEl = f.querySelector('#' + k + '-level'), prEl = f.querySelector('#' + k + '-progress'), owEl = f.querySelector('#' + k + '-owned');
  // Yazarken sınır uygula: sadece rakam, seviye en fazla 100, puan seviyenin istediğinden küçük
  const clampProgress = () => {
    const L = parseInt(lvEl.value, 10);
    if (L === 100) { prEl.value = '0'; prEl.disabled = true; return; }
    prEl.disabled = false;
    if (Number.isInteger(L) && L >= 1 && prEl.value !== '') {
      const max = D[k].req[L - 1] - 1;
      if (parseInt(prEl.value, 10) > max) prEl.value = String(max);
    }
  };
  const digits = el => { const s = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, ''); if (s !== el.value) el.value = s; };
  lvEl.addEventListener('input', () => {
    digits(lvEl);
    if (parseInt(lvEl.value, 10) > 100) lvEl.value = '100';
    updateNeed(k); clampProgress();
  });
  prEl.addEventListener('input', () => { digits(prEl); clampProgress(); });
  owEl.addEventListener('input', () => digits(owEl));
  clampProgress();
  const ex = f.querySelector('#' + k + '-usechance');
  if (ex) ex.addEventListener('change', () => { document.getElementById(k + '-extra').disabled = !ex.checked; });
  updateNeed(k);
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.key)));
show('pet');
</script>
